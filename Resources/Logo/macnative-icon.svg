<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    MacNative app icon — source of truth.
    Concept: two gradient peaks (cyan = the Windows-game world, pink = the Mac) form an M;
    where they meet at the baseline they merge into a bright facet.
    Body: 824x824 continuous-corner squircle (superellipse n=4) centred on a 1024 canvas.
    Rendered pixel-for-pixel by scripts/render-icon.swift (CoreGraphics); keep both in sync.
  -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E1E2A"/>
      <stop offset="0.55" stop-color="#12121A"/>
      <stop offset="1" stop-color="#09090B"/>
    </linearGradient>
    <radialGradient id="glow" gradientUnits="userSpaceOnUse" cx="512" cy="560" r="400">
      <stop offset="0" stop-color="#A21CAF" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#A21CAF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="brand" gradientUnits="userSpaceOnUse" x1="230" y1="380" x2="794" y2="660">
      <stop offset="0" stop-color="#00D4FF"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="sheen" gradientUnits="userSpaceOnUse" x1="512" y1="262" x2="512" y2="718">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="facet" gradientUnits="userSpaceOnUse" x1="512" y1="540" x2="512" y2="718">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.92"/>
      <stop offset="0.55" stop-color="#F5C2FB"/>
      <stop offset="1" stop-color="#E879F9"/>
    </linearGradient>
