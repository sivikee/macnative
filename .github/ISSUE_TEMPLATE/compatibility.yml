name: Compatibility report
description: Tell us how a game runs in MacNative
title: "[Compat] "
labels: ["compatibility"]
body:
  - type: input
    id: game
    attributes: { label: Game, description: "Name and store id, e.g. Left 4 Dead 2 (steam 550)" }
    validations: { required: true }
  - type: dropdown
    id: status
    attributes:
      label: Result
      options: ["Works: plays fine", "Playable: minor issues", "Broken: doesn't run"]
    validations: { required: true }
  - type: textarea
    id: settings
    attributes: { label: Settings used, description: "Graphics backend, engine, Windows version, anything you changed" }
  - type: input
    id: system
    attributes: { label: System, description: "MacNative version, Mac model, macOS version" }
  - type: textarea
    id: notes
    attributes: { label: Notes and log, description: "What happened? Attach the log from game page → ⋯ → Open log." }
